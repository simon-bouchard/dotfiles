[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 12.0

[font.offset]
x = 0
y = 2

[window]
padding = { x = 8, y = 8 }
decorations = "full"
opacity = 1.0

[scrolling]
history = 10000

# Tokyo Night (storm variant — matches your Neovim theme)
[colors.primary]
background = "#24283b"
foreground = "#c0caf5"

[colors.cursor]
text = "#24283b"
cursor = "#c0caf5"

[colors.normal]
black   = "#1d202f"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

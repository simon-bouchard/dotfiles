name: ml
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip

  # Core data
  - numpy
  - pandas
  - scipy
  - statsmodels

  # ML
  - scikit-learn
  - xgboost
  - lightgbm

  # Deep learning (installed separately via install_torch.sh)
  # torch, torchvision, fastai

  # Viz
  - matplotlib
  - seaborn
  - plotly

  # Utilities
  - tqdm
  - pillow
  - ipython
  - requests
  - httpx
